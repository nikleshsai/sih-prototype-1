<!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Register  FarmConnect</title> <meta name="description" content="Create your FarmConnect account as a Farmer or Buyer"> <link rel="stylesheet" href="/css/main.css"> <style> .role-toggle { display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg-input); border-radius: var(--radius-sm); padding: 4px; } .role-btn { flex: 1; padding: 8px; border-radius: 4px; border: none; background: transparent; color: var(--text-secondary); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all var(--transition); font-family: inherit; } .role-btn.active { background: var(--primary); color: white; } .pw-strength { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin-top: 6px; } .pw-strength-fill { height: 100%; transition: width 0.3s,background 0.3s; width: 0; } </style>
</head>
<body> <div class="auth-wrapper"> <div class="auth-card fade-in"> <div class="lang-switcher" id="lang-switcher" style="justify-content:center;margin-bottom:16px;" aria-label="Language selection"><!-- rendered by JS --></div> <div class="auth-logo"> <div class="logo-big"></div> <h1 class="auth-title">Join FarmConnect</h1> <p class="auth-subtitle">Create your account to get started</p> </div> <div class="role-toggle"> <button class="role-btn active" data-role="farmer" id="btn-farmer" onclick="setRole('farmer')"> I'm a Farmer</button> <button class="role-btn" data-role="customer" id="btn-customer" onclick="setRole('customer')">I'm a Buyer</button> </div> <div id="alert-box" class="alert alert-danger hidden"> <span class="alert-icon"></span> <span id="alert-msg">Registration failed</span> </div> <div id="success-box" class="alert alert-success hidden"> <span class="alert-icon"></span> <span id="success-msg">Account created! Complete your profile after login.</span> </div> <form id="register-form" novalidate> <input type="hidden" id="role-field" value="farmer"> <div class="form-group"> <label class="form-label" for="email">Email Address <span class="required">*</span></label> <input id="email" type="email" class="form-input" placeholder="you@example.com" autocomplete="email" required> <span class="form-error" id="email-error"></span> </div> <div class="form-group"> <label class="form-label" for="password">Password <span class="required">*</span></label> <input id="password" type="password" class="form-input" placeholder="Min. 8 chars: A-Z, a-z, 0-9, !@#$%" required> <div class="pw-strength"><div class="pw-strength-fill" id="pw-fill"></div></div> <span class="form-error" id="password-error"></span> <span class="form-hint">Must include uppercase, lowercase, number, and special character</span> </div> <div class="form-group"> <label class="form-label" for="confirm-password">Confirm Password <span class="required">*</span></label> <input id="confirm-password" type="password" class="form-input" placeholder="Repeat your password" required> <span class="form-error" id="confirm-error"></span> </div> <button type="submit" class="btn btn-primary btn-full btn-lg" id="register-btn"> Create Account </button> </form> <div style="text-align:center;margin-top:20px;font-size:0.875rem;color:var(--text-secondary);"> Already have an account? <a href="/login.html">Sign in</a> </div> <div style="text-align:center;margin-top:12px;"> <a href="/index.html" style="font-size:0.8rem;color:var(--text-muted);">Back to Home</a> </div> </div> </div> <script src="/js/config.js"></script> <script src="/js/i18n.js"></script> <script src="/js/api.js"></script> <script> const roleFromUrl = new URLSearchParams(window.location.search).get('role'); if (roleFromUrl === 'customer') setRole('customer'); function setRole(role) { document.getElementById('role-field').value = role; document.getElementById('btn-farmer').classList.toggle('active', role === 'farmer'); document.getElementById('btn-customer').classList.toggle('active', role === 'customer'); } // Password strength indicator document.getElementById('password').addEventListener('input', function() { const val = this.value; let score = 0; if (val.length >= 8) score++; if (/[A-Z]/.test(val)) score++; if (/[a-z]/.test(val)) score++; if (/[0-9]/.test(val)) score++; if (/[!@#$%^&*]/.test(val)) score++; const fill = document.getElementById('pw-fill'); const pct = (score / 5) * 100; fill.style.width = pct + '%'; fill.style.background = score <= 2 ? '#F85149' : score <= 3 ? '#D29922' : '#3FB950'; }); document.getElementById('register-form').addEventListener('submit', async (e) => { e.preventDefault(); const email = document.getElementById('email').value.trim(); const password = document.getElementById('password').value; const confirm = document.getElementById('confirm-password').value; const role = document.getElementById('role-field').value; const btn = document.getElementById('register-btn'); const alertBox = document.getElementById('alert-box'); const successBox = document.getElementById('success-box'); alertBox.classList.add('hidden'); successBox.classList.add('hidden'); // Validation let valid = true; if (!email || !/^\S+@\S+\.\S+$/.test(email)) { document.getElementById('email-error').textContent = 'Valid email required'; document.getElementById('email-error').classList.add('show'); valid = false; } else { document.getElementById('email-error').classList.remove('show'); } const pwErrors = []; if (password.length < 8) pwErrors.push('Min. 8 characters'); if (!/[A-Z]/.test(password)) pwErrors.push('Uppercase required'); if (!/[a-z]/.test(password)) pwErrors.push('Lowercase required'); if (!/[0-9]/.test(password)) pwErrors.push('Number required'); if (!/[!@#$%^&*]/.test(password)) pwErrors.push('Special character required'); if (pwErrors.length) { document.getElementById('password-error').textContent = pwErrors.join(' · '); document.getElementById('password-error').classList.add('show'); valid = false; } else { document.getElementById('password-error').classList.remove('show'); } if (password !== confirm) { document.getElementById('confirm-error').textContent = 'Passwords do not match'; document.getElementById('confirm-error').classList.add('show'); valid = false; } else { document.getElementById('confirm-error').classList.remove('show'); } if (!valid) return; setLoading(btn, true); try { const data = await API.post('/api/auth/register', { email, password, role }, { silent: true }); if (data) { successBox.classList.remove('hidden'); document.getElementById('success-msg').textContent = `Account created! Please login to complete your ${role} profile.`; setTimeout(() => window.location.href = '/login.html', 2000); } } catch (err) { document.getElementById('alert-msg').textContent = err.data?.error || 'Registration failed'; alertBox.classList.remove('hidden'); } finally { setLoading(btn, false); } }); </script> <script> // I18N: Initialize language switcher on nav pages var ls = document.getElementById('nav-lang-switcher'); if (ls) ls.innerHTML = I18N.renderSwitcher(); </script>
</body>
</html>
