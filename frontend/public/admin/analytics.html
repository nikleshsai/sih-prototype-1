 <!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Analytics & Demand Intelligence  Admin</title> <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-layout"> <aside class="sidebar"> <div class="sidebar-logo"><div class="logo-icon"></div><div><div class="logo-text">FarmConnect</div><div class="logo-sub">Admin Console</div></div></div> <nav class="sidebar-nav"> <div class="nav-section">Overview</div><a href="/admin/dashboard.html" class="nav-item"><span class="nav-icon">&#9635;</span> Dashboard</a> <div class="nav-section">Management</div> <a href="/admin/farmers.html" class="nav-item"><span class="nav-icon">&#9651;</span> Farmers</a> <a href="/admin/customers.html" class="nav-item"><span class="nav-icon"></span> Buyers</a> <a href="/admin/orders.html" class="nav-item"><span class="nav-icon">&#9660;</span> Orders</a> <div class="nav-section">Intelligence</div> <a href="/admin/analytics.html" class="nav-item active"><span class="nav-icon">&#9636;</span> Analytics</a> <a href="/admin/logistics.html" class="nav-item"><span class="nav-icon">&#9654;</span> Logistics</a> <div class="nav-section">Security</div><a href="/admin/audit.html" class="nav-item"><span class="nav-icon"></span> Audit Log</a> </nav> <div class="nav-lang-switcher" id="nav-lang-switcher"></div><div class="sidebar-footer"><button onclick="API.logout()" class="btn btn-ghost btn-sm btn-full"> Sign Out</button></div> </aside> <div class="main-content"> <header class="top-header"> <div><span class="header-title">Demand Intelligence</span><span class="header-subtitle">Regional supply-demand forecasting and gap analysis</span></div> <span class="badge badge-danger"> ADMIN</span> </header> <div class="page-content"> <!-- Forecast Controls --> <div class="card" style="margin-bottom:20px;"> <div class="card-header"><span class="card-title"> Demand Forecast Query</span></div> <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;"> <div class="form-group" style="margin:0;flex:1;min-width:150px;"> <label class="form-label">Crop</label> <select id="crop-select" class="form-select"><option value="">Select crop...</option></select> </div> <div class="form-group" style="margin:0;flex:1;min-width:150px;"> <label class="form-label">District</label> <select id="district-select" class="form-select"><option value="">All districts (state level)</option></select> </div> <button class="btn btn-primary" onclick="runForecast()" id="forecast-btn"> Run Forecast</button> </div> </div> <!-- Forecast Result --> <div id="forecast-result"></div> <!-- Top Crops by Demand --> <div class="card" style="margin-top:20px;"> <div class="card-header"><span class="card-title"> Top Crops by 30-Day Demand</span></div> <div id="top-crops-table"></div> </div> <!-- Payment Analytics --> <div class="card" style="margin-top:20px;"> <div class="card-header"><span class="card-title"> Payment & Settlement Analytics</span></div> <div id="payment-analytics"></div> </div> </div> </div>
</div> <script src="/js/config.js"></script> <script src="/js/i18n.js"></script> <script src="/js/api.js"></script> <script src="/js/data.js"></script>
<script>
 async function init() {
  // Populate dropdowns — always works even if API is down
  await DATA.smartPopulateCrops(document.getElementById('crop-select'));
  await DATA.smartPopulateDistricts(document.getElementById('district-select'), true);
  loadTopCrops();
  loadPaymentAnalytics();
} async function runForecast() { const crop = document.getElementById('crop-select').value; const district = document.getElementById('district-select').value; if (!crop) { showToast('Select a crop first', 'warn'); return; } const btn = document.getElementById('forecast-btn'); setLoading(btn, true); try { const data = await API.get(`/api/admin/analytics/demand?crop=${encodeURIComponent(crop)}&district=${encodeURIComponent(district)}`); renderForecastResult(data); } catch(e) { console.error('[Page Error]', e); } finally { setLoading(btn, false); }
} function renderForecastResult(d) { const container = document.getElementById('forecast-result'); if (d.confidence === 'unavailable') { container.innerHTML = `<div class="alert alert-warn"><span class="alert-icon"></span><span>${escapeHtml(d.message || 'Insufficient data for forecast')}</span></div>`; return; } const gapColor = d.gap_type === 'shortage' ? 'var(--accent-admin)' : d.gap_type === 'surplus' ? 'var(--accent-success)' : 'var(--accent-warn)'; const gapIcon = d.gap_type === 'shortage' ? '' : d.gap_type === 'surplus' ? '' : ''; container.innerHTML = ` <div class="card"> <div class="card-header"> <span class="card-title"> Forecast: ${escapeHtml(d.crop_name)} · ${escapeHtml(d.region_district || d.region_state)}</span> ${confidenceBadge(d.confidence)} </div> <div class="alert alert-info" style="margin-bottom:16px;"> <span class="alert-icon"></span> <span>${escapeHtml(d.message || '')} Method: ${escapeHtml(d.forecast_method || '')}</span> </div> <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:20px;"> <div class="stat-card" style="--stat-color:var(--accent-info)"> <div class="stat-label">Predicted Daily Demand</div> <div class="stat-value">${d.predicted_demand_kg ? formatKg(d.predicted_demand_kg) : ''}</div> <div class="stat-sub">${demandDirection(d.demand_direction)}</div> </div> <div class="stat-card" style="--stat-color:var(--primary)"> <div class="stat-label">Available Supply</div> <div class="stat-value">${formatKg(d.supply_available_kg || 0)}</div> <div class="stat-sub">Current stock</div> </div> <div class="stat-card" style="--stat-color:var(--accent-warn)"> <div class="stat-label">Expected Supply (30d)</div> <div class="stat-value">${formatKg(d.supply_expected_kg || 0)}</div> <div class="stat-sub">Upcoming harvest</div> </div> <div class="stat-card" style="--stat-color:${gapColor}"> <div class="stat-label">30-Day Gap</div> <div class="stat-value" style="color:${gapColor}">${d.gap_kg >= 0 ? '+' : ''}${formatKg(Math.abs(d.gap_kg || 0))}</div> <div class="stat-sub">${gapIcon} ${escapeHtml(d.gap_type || '')}</div> </div> </div> ${d.seven_day_view && d.seven_day_view.length ? ` <div class="card-title" style="margin-bottom:12px;">14-Day View (7 actual + 7 forecast)</div> <div class="demand-bars" id="forecast-chart"></div> <div style="display:flex;gap:16px;margin-top:8px;font-size:0.7rem;color:var(--text-muted);"> <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:var(--primary);border-radius:2px;display:inline-block;"></span> Actual Sales</span> <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:rgba(56,139,253,0.5);border:1px dashed var(--accent-info);border-radius:2px;display:inline-block;"></span> Forecast (estimated)</span> </div> ` : ''} </div> `; if (d.seven_day_view) { renderDemandBars('forecast-chart', d.seven_day_view); }
} async function loadTopCrops() { try { const data = await API.get('/api/admin/analytics/top-crops'); const crops = data.top_crops || []; const container = document.getElementById('top-crops-table'); if (!crops.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><p>No demand data yet</p></div>'; return; } container.innerHTML = `<div class="table-wrapper"><table> <thead><tr><th>Crop</th><th>District</th><th>30-Day Total</th><th>Avg Daily</th><th>Data Days</th></tr></thead> <tbody>${crops.map((c,i) => ` <tr> <td><strong>${i+1}. ${escapeHtml(c.crop_name)}</strong></td> <td>${escapeHtml(c.region_district)}</td> <td>${formatKg(c.total_sold)}</td> <td>${formatKg(Math.round(c.avg_daily))}/day</td> <td>${c.days_data} days</td> </tr> `).join('')}</tbody> </table></div>`; } catch(e) { console.error('[Page Error]', e); }
} async function loadPaymentAnalytics() { try { const data = await API.get('/api/admin/analytics/payments'); const container = document.getElementById('payment-analytics'); const payments = data.payment_summary || []; const settlements = data.settlement_summary || []; container.innerHTML = ` <div class="grid-2"> <div> <div class="form-label" style="margin-bottom:8px;">Payment Status</div> ${payments.map(p => ` <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg-elevated);border-radius:4px;margin-bottom:4px;font-size:0.8rem;"> <span>${escapeHtml(p.payment_phase?.replace(/_/g,' '))} · ${statusBadge(p.payment_status)}</span> <span>${formatCurrency(Math.round(p.total_paise/100))} (${p.count})</span> </div> `).join('') || '<p style="font-size:0.8rem;color:var(--text-muted)">No payments yet</p>'} </div> <div> <div class="form-label" style="margin-bottom:8px;">Farmer Settlements</div> ${settlements.map(s => ` <div style="display:flex;justify-content:space-between;padding:8px;background:var(--bg-elevated);border-radius:4px;margin-bottom:4px;font-size:0.8rem;"> <span>${statusBadge(s.settlement_status)}</span> <span>${formatCurrency(s.total_inr)} (${s.count})</span> </div> `).join('') || '<p style="font-size:0.8rem;color:var(--text-muted)">No settlements yet</p>'} </div> </div> `; } catch(e) { console.error('[Page Error]', e); }
} init();
</script> <script> // I18N: Initialize language switcher on nav pages var ls = document.getElementById('nav-lang-switcher'); if (ls) ls.innerHTML = I18N.renderSwitcher(); </script>
</body>
</html>
