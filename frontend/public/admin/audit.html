 <!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Audit Log  Admin</title> <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-layout"> <aside class="sidebar"> <div class="sidebar-logo"><div class="logo-icon"></div><div><div class="logo-text">FarmConnect</div><div class="logo-sub">Admin Console</div></div></div> <nav class="sidebar-nav"> <div class="nav-section">Overview</div><a href="/admin/dashboard.html" class="nav-item"><span class="nav-icon">&#9635;</span> Dashboard</a> <div class="nav-section">Management</div> <a href="/admin/farmers.html" class="nav-item"><span class="nav-icon">&#9651;</span> Farmers</a> <a href="/admin/customers.html" class="nav-item"><span class="nav-icon"></span> Buyers</a> <a href="/admin/orders.html" class="nav-item"><span class="nav-icon">&#9660;</span> Orders</a> <div class="nav-section">Intelligence</div> <a href="/admin/analytics.html" class="nav-item"><span class="nav-icon">&#9636;</span> Analytics</a> <a href="/admin/logistics.html" class="nav-item"><span class="nav-icon">&#9654;</span> Logistics</a> <div class="nav-section">Security</div><a href="/admin/audit.html" class="nav-item active"><span class="nav-icon"></span> Audit Log</a> </nav> <div class="nav-lang-switcher" id="nav-lang-switcher"></div><div class="sidebar-footer"><button onclick="API.logout()" class="btn btn-ghost btn-sm btn-full"> Sign Out</button></div> </aside> <div class="main-content"> <header class="top-header"> <div><span class="header-title">Security Audit Log</span><span class="header-subtitle">Immutable record of all platform actions</span></div> <div style="display:flex;gap:8px;"> <input id="action-filter" type="text" class="form-input" style="width:180px;" placeholder="Filter by action..." oninput="loadAudit()"> <span class="badge badge-danger"> ADMIN</span> </div> </header> <div class="page-content"> <!-- Security Summary --> <div id="security-events-section" class="card" style="margin-bottom:20px;"> <div class="card-header"><span class="card-title"> Security Events (Last 100)</span></div> <div id="security-events"></div> </div> <!-- Full Audit Log --> <div class="card"> <div class="card-header"> <span class="card-title"> Full Audit Trail</span> <span id="audit-count" style="font-size:0.75rem;color:var(--text-muted)"></span> </div> <div id="audit-table"></div> <div style="display:flex;gap:8px;margin-top:16px;justify-content:center;" id="pagination"></div> </div> </div> </div>
</div> <script src="/js/config.js"></script> <script src="/js/i18n.js"></script> <script src="/js/api.js"></script>
<script>

let currentPage = 1; const actionIcons = { LOGIN_SUCCESS: '', LOGIN_FAILED: '', LOGIN_BLOCKED: 'ð', LOGOUT: '', USER_REGISTER: '', FARMER_VERIFY: '', CUSTOMER_VERIFY: '', ORDER_MATCH_PREVIEW: '', ORDER_MATCH_COMMIT: '', ORDER_STATUS_CHANGE: '', LOGISTICS_PLAN: '', LOGISTICS_STATUS: '', FARMER_SETTLEMENT: '', FARMER_DELETE: 'ð',
}; async function loadAudit() { const action = document.getElementById('action-filter').value; try { const data = await API.get(`/api/admin/audit?page=${currentPage}&limit=50${action ? '&action='+encodeURIComponent(action) : ''}`); const logs = data.logs || []; document.getElementById('audit-count').textContent = `${data.total} total records · Page ${data.page}/${data.pages}`; const table = document.getElementById('audit-table'); if (!logs.length) { table.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><p>No audit records found</p></div>'; return; } table.innerHTML = `<div class="table-wrapper"><table> <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>Result</th><th>IP</th></tr></thead> <tbody>${logs.map(l => ` <tr> <td style="white-space:nowrap;font-size:0.75rem;">${formatDate(l.timestamp)}<br><small style="color:var(--text-muted)">${new Date(l.timestamp).toLocaleTimeString('en-IN')}</small></td> <td style="font-size:0.8rem;">${escapeHtml(l.user_email || 'System')}</td> <td><span style="font-size:0.85rem;">${actionIcons[l.action] || ''} ${escapeHtml(l.action.replace(/_/g,' '))}</span></td> <td style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(l.target_entity || '')} ${l.target_id ? '#'+l.target_id : ''}</td> <td>${l.result === 'success' ? '<span class="badge badge-success">â OK</span>' : '<span class="badge badge-danger"> FAIL</span>'}</td> <td style="font-size:0.7rem;color:var(--text-muted);font-family:monospace;">${escapeHtml(l.ip_address || '')}</td> </tr> `).join('')}</tbody> </table></div>`; // Pagination const pages = document.getElementById('pagination'); pages.innerHTML = ''; if (data.pages > 1) { if (currentPage > 1) pages.innerHTML += `<button class="btn btn-outline btn-sm" onclick="changePage(${currentPage-1})"> Prev</button>`; pages.innerHTML += `<span style="font-size:0.8rem;color:var(--text-muted);padding:6px 12px;">Page ${currentPage} of ${data.pages}</span>`; if (currentPage < data.pages) pages.innerHTML += `<button class="btn btn-outline btn-sm" onclick="changePage(${currentPage+1})">Next </button>`; } } catch(e) { console.error('[Page Error]', e); }
} async function loadSecurityEvents() { try { const data = await API.get('/api/admin/audit/security-events'); const events = data.events || []; const container = document.getElementById('security-events'); if (!events.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><p>No security events</p></div>'; return; } container.innerHTML = events.slice(0,10).map(e => ` <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);"> <span style="font-size:1rem;">${actionIcons[e.action] || ''}</span> <div style="flex:1;"> <div style="font-size:0.8rem;font-weight:600;${e.result==='failure'?'color:var(--accent-admin)':''}">${escapeHtml(e.action.replace(/_/g,' '))}</div> <div style="font-size:0.7rem;color:var(--text-muted);">${escapeHtml(e.user_email || '')} · ${escapeHtml(e.ip_address || '')}</div> </div> <div style="text-align:right;"> ${e.result === 'success' ? '<span class="badge badge-success">OK</span>' : '<span class="badge badge-danger">FAIL</span>'} <div style="font-size:0.65rem;color:var(--text-muted);">${timeAgo(e.timestamp)}</div> </div> </div> `).join(''); } catch(e) { console.error('[Page Error]', e); }
} function changePage(p) { currentPage = p; loadAudit(); window.scrollTo(0,0); } loadAudit();
loadSecurityEvents(); </script> <script> // I18N: Initialize language switcher on nav pages var ls = document.getElementById('nav-lang-switcher'); if (ls) ls.innerHTML = I18N.renderSwitcher(); </script>
</body>
</html>
