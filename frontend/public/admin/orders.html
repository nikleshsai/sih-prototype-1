 <!DOCTYPE html>
<html lang="en">
<head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Order Management  Admin</title> <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="app-layout"> <aside class="sidebar"> <div class="sidebar-logo"><div class="logo-icon"></div><div><div class="logo-text">FarmConnect</div><div class="logo-sub">Admin Console</div></div></div> <nav class="sidebar-nav"> <div class="nav-section">Overview</div> <a href="/admin/dashboard.html" class="nav-item"><span class="nav-icon">&#9635;</span> Dashboard</a> <div class="nav-section">Management</div> <a href="/admin/farmers.html" class="nav-item"><span class="nav-icon">&#9651;</span> Farmers</a> <a href="/admin/customers.html" class="nav-item"><span class="nav-icon"></span> Buyers</a> <a href="/admin/orders.html" class="nav-item active"><span class="nav-icon">&#9660;</span> Orders</a> <div class="nav-section">Intelligence</div> <a href="/admin/analytics.html" class="nav-item"><span class="nav-icon">&#9636;</span> Analytics</a> <a href="/admin/logistics.html" class="nav-item"><span class="nav-icon">&#9654;</span> Logistics</a> <div class="nav-section">Security</div> <a href="/admin/audit.html" class="nav-item"><span class="nav-icon"></span> Audit Log</a> </nav> <div class="nav-lang-switcher" id="nav-lang-switcher"></div><div class="sidebar-footer"><button onclick="API.logout()" class="btn btn-ghost btn-sm btn-full"> Sign Out</button></div> </aside> <div class="main-content"> <header class="top-header"> <div><span class="header-title">Order Management</span><span class="header-subtitle">Match farmers to orders and manage fulfillment</span></div> <div style="display:flex;gap:8px;"> <select id="status-filter" class="form-select" style="width:160px;" onchange="loadOrders()"> <option value="">All Statuses</option> <option value="pending" selected>Pending</option> <option value="matched">Matched</option> <option value="confirmed">Confirmed</option> <option value="in_fulfillment">In Fulfillment</option> <option value="delivered">Delivered</option> <option value="cancelled">Cancelled</option> </select> <span class="badge badge-danger"> ADMIN</span> </div> </header> <div class="page-content"> <div class="card"> <div id="orders-table"> <div class="empty-state"><div class="empty-icon"></div><p>Loading orders...</p></div> </div> </div> </div> </div>
</div> <!-- Order Detail Modal -->
<div class="modal-overlay" id="order-modal"> <div class="modal" style="max-width:700px;"> <div class="modal-header"> <h3 class="modal-title" id="modal-order-ref">Order Details</h3> <button class="modal-close" onclick="closeModal()"></button> </div> <div id="modal-body" style="max-height:70vh;overflow-y:auto;"></div> <div class="modal-footer" id="modal-actions"></div> </div>
</div> <script src="/js/config.js"></script> <script src="/js/i18n.js"></script> <script src="/js/api.js"></script>
<script>

let currentOrderId = null;
let matchPlan = null; async function loadOrders() { const status = document.getElementById('status-filter').value; try { const data = await API.get(`/api/admin/orders${status ? '?status=' + status : ''}`); const orders = data.orders || []; const container = document.getElementById('orders-table'); if (!orders.length) { container.innerHTML = '<div class="empty-state"><div class="empty-icon"></div><h3>No orders</h3><p>No orders match this filter</p></div>'; return; } container.innerHTML = `<div class="table-wrapper"><table> <thead><tr><th>Order Ref</th><th>Crop</th><th>Quantity</th><th>Customer</th><th>Delivery District</th><th>Required By</th><th>Status</th><th>Payment</th><th>Action</th></tr></thead> <tbody>${orders.map(o => ` <tr> <td><code style="font-size:0.75rem;color:var(--primary)">${escapeHtml(o.order_ref)}</code><br><span class="badge badge-muted">${escapeHtml(o.order_type)}</span></td> <td><strong>${escapeHtml(o.crop_name)}</strong>${o.crop_variety ? `<br><small>${escapeHtml(o.crop_variety)}</small>` : ''}<br><span class="badge badge-info">Grade ${escapeHtml(o.grade_required)}</span></td> <td>${formatKg(o.quantity_kg_requested)}${o.quantity_kg_fulfilled > 0 ? `<br><small style="color:var(--primary)">${formatKg(o.quantity_kg_fulfilled)} matched</small>` : ''}</td> <td>${escapeHtml(o.customer_name || '')}<br><small style="color:var(--text-muted)">${escapeHtml(o.business_name || '')}</small></td> <td>${escapeHtml(o.delivery_district)}</td> <td>${formatDate(o.delivery_date_required)}</td> <td>${statusBadge(o.status)}</td> <td>${statusBadge(o.payment_status)}</td> <td><button class="btn btn-outline btn-sm" onclick="viewOrder(${o.id})">Manage </button></td> </tr> `).join('')}</tbody> </table></div>`; } catch(e) { console.error('[Page Error]', e); }
} async function viewOrder(id) { currentOrderId = id; matchPlan = null; try { const data = await API.get(`/api/admin/orders/${id}`); const o = data.order; const assignments = data.assignments || []; const logistics = data.logistics; const payments = data.payments || []; document.getElementById('modal-order-ref').textContent = ` ${o.order_ref}`; let assignmentsHtml = ''; if (assignments.length) { const total = assignments.reduce((s, a) => s + a.quantity_kg_assigned, 0); assignmentsHtml = ` <div style="margin:12px 0;"> <div class="form-label">Multi-Farmer Aggregation (${assignments.length} farmers)</div> ${assignments.map(a => { const pct = Math.round((a.quantity_kg_assigned / o.quantity_kg_requested) * 100); return `<div class="traceability-item"> <div style="flex:1;"> <div class="traceability-farmer"> ${escapeHtml(a.farmer_name)} · ${escapeHtml(a.district)}</div> <div class="traceability-bar"><div class="traceability-fill" style="width:${pct}%"></div></div> </div> <div style="text-align:right;"> <div class="traceability-qty">${formatKg(a.quantity_kg_assigned)}</div> <div style="font-size:0.7rem;color:var(--text-muted);">${pct}% · ${statusBadge(a.farmer_status)}</div> </div> </div>`; }).join('')} <div style="font-size:0.8rem;font-weight:600;text-align:right;margin-top:4px;color:var(--primary);">Total: ${formatKg(total)} / ${formatKg(o.quantity_kg_requested)}</div> </div> `; } let paymentsHtml = ''; if (payments.length) { paymentsHtml = `<div style="margin:12px 0;"> <div class="form-label">Payment History</div> ${payments.map(p => ` <div style="display:flex;justify-content:space-between;padding:6px;background:var(--bg-elevated);border-radius:4px;margin-bottom:4px;font-size:0.8rem;"> <span>${escapeHtml(p.payment_phase?.replace(/_/g,' '))} · ${escapeHtml(p.gateway)}</span> <span>${formatCurrency(p.amount_paise/100)} · ${statusBadge(p.payment_status)}</span> </div> `).join('')} </div>`; } document.getElementById('modal-body').innerHTML = ` <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;"> <div><div class="form-label">Crop</div><div>${escapeHtml(o.crop_name)} ${o.crop_variety ? '('+escapeHtml(o.crop_variety)+')' : ''}</div></div> <div><div class="form-label">Quantity</div><div>${formatKg(o.quantity_kg_requested)}</div></div> <div><div class="form-label">Grade Required</div><div>Grade ${escapeHtml(o.grade_required)}</div></div> <div><div class="form-label">Max Price</div><div>${o.price_per_kg_max ? formatCurrency(o.price_per_kg_max)+'/kg' : 'Flexible'}</div></div> <div><div class="form-label">Delivery Location</div><div>${escapeHtml(o.delivery_location)}</div></div> <div><div class="form-label">Required By</div><div>${formatDate(o.delivery_date_required)}</div></div> <div><div class="form-label">Status</div><div>${statusBadge(o.status)}</div></div> <div><div class="form-label">Payment</div><div>${statusBadge(o.payment_status)} · 50%: ${statusBadge(o.payment_50_status)}</div></div> </div> ${assignmentsHtml} ${paymentsHtml} ${logistics ? `<div class="alert alert-info"><span class="alert-icon"></span><span>Logistics: ${escapeHtml(logistics.status)} · ${logistics.estimated_distance_km ? logistics.estimated_distance_km+'km' : 'distance TBD'}</span></div>` : ''} ${o.special_requirements ? `<div class="form-group"><div class="form-label">Special Requirements</div><p style="font-size:0.875rem;">${escapeHtml(o.special_requirements)}</p></div>` : ''} <div id="match-preview"></div> `; renderOrderActions(o, assignments.length > 0); document.getElementById('order-modal').classList.add('show'); } catch(e) { console.error('[Page Error]', e); }
} function renderOrderActions(order, hasAssignments) { const actions = document.getElementById('modal-actions'); let btns = `<button class="btn btn-ghost" onclick="closeModal()">Close</button>`; if (order.status === 'pending') { btns += `<button class="btn btn-outline btn-sm" onclick="runMatchPreview()"> Preview Match</button>`; } if (order.status === 'matched') { btns += `<button class="btn btn-primary btn-sm" onclick="confirmOrder()">â Confirm Order</button>`; } if (order.status === 'confirmed') { btns += `<a href="/admin/logistics.html" class="btn btn-outline btn-sm"> Plan Logistics</a>`; btns += `<button class="btn btn-primary btn-sm" onclick="updateStatus('in_fulfillment')"> Start Fulfillment</button>`; } if (order.status === 'in_fulfillment') { btns += `<button class="btn btn-primary btn-sm" onclick="updateStatus('delivered')"> Mark Delivered</button>`; } if (!['delivered','cancelled'].includes(order.status)) { btns += `<button class="btn btn-danger btn-sm" onclick="updateStatus('cancelled')"> Cancel</button>`; } actions.innerHTML = btns;
} async function runMatchPreview() { const preview = document.getElementById('match-preview'); preview.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted)">Running match algorithm...</div>'; try { matchPlan = await API.post(`/api/admin/orders/${currentOrderId}/match`, {}); let html = `<div class="alert ${matchPlan.success ? 'alert-success' : 'alert-warn'}"> <span class="alert-icon">${matchPlan.success ? '' : ''}</span> <span>${escapeHtml(matchPlan.message)}</span> </div>`; if (matchPlan.assignments && matchPlan.assignments.length) { html += `<div class="form-label">Proposed Match (${matchPlan.farmer_count} farmers)</div>`; html += matchPlan.assignments.map(a => ` <div class="traceability-item"> <div style="flex:1;"> <div class="traceability-farmer">${escapeHtml(a.farmer_name)} · ${escapeHtml(a.farmer_district)}</div> <div style="font-size:0.7rem;color:var(--text-muted);">${escapeHtml(a.supply_type)} supply · Grade ${escapeHtml(a.grade)} · ${a.distance_km}km away · Score: ${a.score}</div> </div> <div class="traceability-qty">${formatKg(a.quantity_kg_assigned)}</div> </div> `).join(''); if (matchPlan.success) { html += `<button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="commitMatch()">â Commit This Match</button>`; } } preview.innerHTML = html; } catch(e) { console.error('[Page Error]', e); }
} async function commitMatch() { if (!matchPlan || !matchPlan.assignments.length) return; try { await API.post(`/api/admin/orders/${currentOrderId}/commit-match`, { assignments: matchPlan.assignments }); showToast('Match committed! Farmer notifications sent.', 'success'); closeModal(); loadOrders(); } catch(e) { console.error('[Page Error]', e); }
} async function confirmOrder() { try { await API.patch(`/api/admin/orders/${currentOrderId}/status`, { status: 'confirmed' }); showToast('Order confirmed!', 'success'); closeModal(); loadOrders(); } catch(e) { console.error('[Page Error]', e); }
} async function updateStatus(status) { if (status === 'cancelled' && !confirm('Are you sure you want to cancel this order? This action is logged.')) return; try { await API.patch(`/api/admin/orders/${currentOrderId}/status`, { status }); showToast(`Order status updated to ${status}`, 'success'); closeModal(); loadOrders(); } catch(e) { console.error('[Page Error]', e); }
} function closeModal() { document.getElementById('order-modal').classList.remove('show'); }
loadOrders(); </script> <script> // I18N: Initialize language switcher on nav pages var ls = document.getElementById('nav-lang-switcher'); if (ls) ls.innerHTML = I18N.renderSwitcher(); </script>
</body>
</html>
