<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Buyer profile and crop preferences on FarmConnect." />
  <title>My Profile — FarmConnect Buyer</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    /* ── Crop preference card ── */
    .pref-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 13px 15px;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: border-color var(--transition);
    }
    .pref-card:hover { border-color: var(--primary); }

    .pref-info { flex: 1; }
    .pref-name {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .pref-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.75rem;
    }
    .pref-tag {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
      color: var(--text-secondary);
    }

    /* Inline edit form */
    .pref-edit-form {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .pref-edit-form.open { display: block; }

    .edit-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    /* Info grid */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.875rem;
    }
    .info-item .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .info-item .value {
      color: var(--text-primary);
      font-weight: 500;
    }

    /* Edit profile toggle */
    .profile-edit-form {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .profile-edit-form.open { display: block; }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin: 16px 0 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     APP LAYOUT
════════════════════════════════════════════════════ -->
<div class="app-layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"></div>
      <div>
        <div class="logo-text">FarmConnect</div>
        <div class="logo-sub">Buyer Portal</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section">Shopping</div>
      <a href="/customer/dashboard.html" class="nav-item">
        <span class="nav-icon">&#9635;</span> Dashboard
      </a>
      <a href="/customer/marketplace.html" class="nav-item">
        <span class="nav-icon">&#9632;</span> Marketplace
      </a>
      <a href="/customer/orders.html" class="nav-item">
        <span class="nav-icon">&#9660;</span> My Orders
      </a>

      <div class="nav-section">Account</div>
      <a href="/customer/profile.html" class="nav-item active">
        <span class="nav-icon">&#9711;</span> My Profile
      </a>
    </nav>

    <div class="nav-lang-switcher" id="nav-lang-switcher"></div>

    <div class="sidebar-footer">
      <button onclick="API.logout()" class="btn btn-ghost btn-sm btn-full">
        &#x2192; Sign Out
      </button>
    </div>
  </aside>

  <!-- ── Main Content ── -->
  <div class="main-content">

    <header class="top-header">
      <div>
        <span class="header-title">&#9711; My Buyer Profile</span>
        <span class="header-subtitle">Account details and crop preferences</span>
      </div>
      <div id="header-actions"></div>
    </header>

    <div class="page-content">
      <div id="profile-content">
        <div class="empty-state"><div class="empty-icon"></div><p>Loading profile…</p></div>
      </div>
    </div>

  </div><!-- /.main-content -->
</div><!-- /.app-layout -->


<!-- ═══════════════════════════════════════════════════
     SCRIPTS
════════════════════════════════════════════════════ -->
<script src="/js/config.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/api.js"></script>

<script>
  /* ── Constants ── */
  const DISTRICTS = [
    'Chennai','Coimbatore','Madurai','Tiruchirappalli','Salem','Tirunelveli',
    'Vellore','Erode','Thoothukudi','Namakkal','Thanjavur','Dindigul',
    'Cuddalore','Krishnagiri','Dharmapuri','Tiruppur','Virudhunagar',
    'Ramanathapuram','Sivaganga','Pudukkottai',
  ];

  const ALL_CROPS = [
    'Tomato','Onion','Potato','Brinjal','Okra','Carrot','Cabbage',
    'Cauliflower','Beans','Spinach','Chilli','Banana','Mango',
    'Paddy','Maize','Groundnut','Sugarcane',
  ];

  /* Crop preferences stored locally for demo (keyed by buyer profile id) */
  const PREF_KEY = 'buyer_crop_prefs';

  function loadPrefs() {
    try { return JSON.parse(localStorage.getItem(PREF_KEY) || '[]'); }
    catch { return []; }
  }

  function savePrefs(prefs) {
    localStorage.setItem(PREF_KEY, JSON.stringify(prefs));
  }

  /* ════════════════════════════════════════════════
     Bootstrap
  ════════════════════════════════════════════════ */
  async function init() {
    try {
      const data    = await API.get('/api/customer/profile', { silent: true });
      const profile = data?.profile;
      profile ? renderProfile(profile) : renderForm();
    } catch (e) {
      console.error('[Profile] Init error:', e);
    }
  }

  /* ════════════════════════════════════════════════
     Registration form (first-time setup)
  ════════════════════════════════════════════════ */
  function renderForm() {
    document.getElementById('profile-content').innerHTML = `
      <div class="card">
        <h2 style="margin-bottom:20px;">Complete Your Buyer Registration</h2>
        <div class="alert alert-warn" style="margin-bottom:20px;">
          <span class="alert-icon">&#9888;</span>
          <span>Fill in all details. Admin will verify before approving your account to place orders.</span>
        </div>

        <div class="section-title">Personal Information</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Full Name <span class="required">*</span></label>
            <input id="p-name" class="form-input" placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label class="form-label">Mobile <span class="required">*</span></label>
            <input id="p-mobile" class="form-input" placeholder="10-digit number" />
          </div>
        </div>

        <div class="section-title">Business Details</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Business Name</label>
            <input id="p-biz" class="form-input" placeholder="Shop / company name (optional)" />
          </div>
          <div class="form-group">
            <label class="form-label">Business Type</label>
            <select id="p-biz-type" class="form-select">
              <option value="">Individual</option>
              <option value="retailer">Retailer</option>
              <option value="wholesaler">Wholesaler</option>
              <option value="restaurant">Restaurant / Hotel</option>
              <option value="exporter">Exporter</option>
              <option value="processor">Food Processor</option>
            </select>
          </div>
        </div>

        <div class="section-title">Delivery Address</div>
        <div class="form-group">
          <label class="form-label">Full Address <span class="required">*</span></label>
          <textarea id="p-address" class="form-textarea" placeholder="Full delivery address"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">District <span class="required">*</span></label>
            <select id="p-district" class="form-select">
              <option value="">Select…</option>
              ${DISTRICTS.map(d => `<option>${d}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Pincode <span class="required">*</span></label>
            <input id="p-pincode" class="form-input" placeholder="6-digit pincode" />
          </div>
        </div>

        <div class="section-title">Government ID</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">ID Type</label>
            <select id="p-gov-type" class="form-select">
              <option value="aadhaar">Aadhaar</option>
              <option value="gst">GSTIN</option>
              <option value="pan">PAN</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">ID Number</label>
            <input id="p-gov-num" class="form-input" placeholder="ID number" />
          </div>
        </div>

        <button class="btn btn-primary btn-lg" style="margin-top:16px;" onclick="submitProfile()" id="submit-btn">
          &#10003; Submit for Verification
        </button>
      </div>`;
  }

  /* ════════════════════════════════════════════════
     Render profile view with editable crop prefs
  ════════════════════════════════════════════════ */
  function renderProfile(p) {
    const prefs = loadPrefs();

    document.getElementById('header-actions').innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="toggleProfileEdit()">
        &#9998; Edit Profile
      </button>`;

    document.getElementById('profile-content').innerHTML = `
      <!-- Profile card -->
      <div class="card" style="margin-bottom:16px;">
        <div class="card-header">
          <span class="card-title">&#9711; Buyer Profile</span>
          ${statusBadge(p.verification_status)}
        </div>

        ${p.verification_status === 'pending' ? `
          <div class="alert alert-info" style="margin-bottom:14px;">
            <span class="alert-icon">&#9432;</span>
            <span>Pending admin review. You can browse but cannot place orders until approved.</span>
          </div>` : ''}

        <!-- Read-only view -->
        <div class="info-grid" id="profile-view">
          <div class="info-item">
            <div class="label">Full Name</div>
            <div class="value">${escapeHtml(p.full_name)}</div>
          </div>
          <div class="info-item">
            <div class="label">Mobile</div>
            <div class="value">${escapeHtml(p.mobile)}</div>
          </div>
          <div class="info-item">
            <div class="label">Business Name</div>
            <div class="value">${escapeHtml(p.business_name || '—')}</div>
          </div>
          <div class="info-item">
            <div class="label">Business Type</div>
            <div class="value">${escapeHtml(p.business_type || 'Individual')}</div>
          </div>
          <div class="info-item">
            <div class="label">District</div>
            <div class="value">${escapeHtml(p.district)}</div>
          </div>
          <div class="info-item">
            <div class="label">Pincode</div>
            <div class="value">${escapeHtml(p.pincode)}</div>
          </div>
          <div class="info-item" style="grid-column:1/-1;">
            <div class="label">Delivery Address</div>
            <div class="value">${escapeHtml(p.address)}</div>
          </div>
          <div class="info-item">
            <div class="label">Gov ID (${escapeHtml(p.gov_id_type || '')})</div>
            <div class="value">${escapeHtml(p.gov_id_number || '—')}</div>
          </div>
        </div>

        <!-- Inline edit form (hidden by default) -->
        <div class="profile-edit-form" id="profile-edit-form">
          <div class="section-title">Edit Profile</div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Full Name <span class="required">*</span></label>
              <input id="ep-name" class="form-input" value="${escapeHtml(p.full_name)}" />
            </div>
            <div class="form-group">
              <label class="form-label">Mobile <span class="required">*</span></label>
              <input id="ep-mobile" class="form-input" value="${escapeHtml(p.mobile)}" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Business Name</label>
              <input id="ep-biz" class="form-input" value="${escapeHtml(p.business_name || '')}" />
            </div>
            <div class="form-group">
              <label class="form-label">Business Type</label>
              <select id="ep-biz-type" class="form-select">
                <option value="" ${!p.business_type ? 'selected' : ''}>Individual</option>
                <option value="retailer"   ${p.business_type === 'retailer'   ? 'selected' : ''}>Retailer</option>
                <option value="wholesaler" ${p.business_type === 'wholesaler' ? 'selected' : ''}>Wholesaler</option>
                <option value="restaurant" ${p.business_type === 'restaurant' ? 'selected' : ''}>Restaurant / Hotel</option>
                <option value="exporter"   ${p.business_type === 'exporter'   ? 'selected' : ''}>Exporter</option>
                <option value="processor"  ${p.business_type === 'processor'  ? 'selected' : ''}>Food Processor</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Address <span class="required">*</span></label>
            <textarea id="ep-address" class="form-textarea">${escapeHtml(p.address)}</textarea>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">District <span class="required">*</span></label>
              <select id="ep-district" class="form-select">
                ${DISTRICTS.map(d => `<option ${d === p.district ? 'selected' : ''}>${d}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Pincode <span class="required">*</span></label>
              <input id="ep-pincode" class="form-input" value="${escapeHtml(p.pincode)}" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Gov ID Type</label>
              <select id="ep-gov-type" class="form-select">
                <option value="aadhaar" ${p.gov_id_type === 'aadhaar' ? 'selected' : ''}>Aadhaar</option>
                <option value="gst"     ${p.gov_id_type === 'gst'     ? 'selected' : ''}>GSTIN</option>
                <option value="pan"     ${p.gov_id_type === 'pan'     ? 'selected' : ''}>PAN</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Gov ID Number</label>
              <input id="ep-gov-num" class="form-input" value="${escapeHtml(p.gov_id_number || '')}" />
            </div>
          </div>
          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:10px;">
            <button class="btn btn-ghost btn-sm" onclick="toggleProfileEdit()">Cancel</button>
            <button class="btn btn-primary btn-sm" id="ep-save-btn" onclick="saveProfileEdit()">
              &#10003; Save Changes
            </button>
          </div>
        </div>
      </div>

      <!-- Crop Preferences card -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">&#127807; Crop Preferences</span>
          <div style="display:flex; gap:8px; align-items:center;">
            <span style="font-size:0.75rem; color:var(--text-muted);" id="pref-count">
              ${prefs.length} crop${prefs.length !== 1 ? 's' : ''} saved
            </span>
            <button class="btn btn-primary btn-sm" onclick="showAddPrefForm()">+ Add Crop</button>
          </div>
        </div>

        <div class="alert alert-info" style="margin-bottom:14px;">
          <span class="alert-icon">&#9432;</span>
          <span>
            <strong>Demo tip:</strong> Add your crop needs here so farmers and logistics can be matched to you for demo orders.
          </span>
        </div>

        <!-- Add preference form (hidden initially) -->
        <div id="add-pref-form" style="display:none; background:var(--bg-elevated); border-radius:var(--radius-sm); padding:14px; margin-bottom:14px; border:1px solid var(--primary);">
          <div class="section-title" style="margin-top:0;">New Crop Requirement</div>
          <div class="edit-grid-3">
            <div class="form-group">
              <label class="form-label">Crop <span class="required">*</span></label>
              <select id="np-crop" class="form-select">
                <option value="">Select…</option>
                ${ALL_CROPS.map(c => `<option>${c}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Qty Needed (kg/month)</label>
              <input id="np-qty" type="number" class="form-input" placeholder="e.g. 500" />
            </div>
            <div class="form-group">
              <label class="form-label">Max Price (₹/kg)</label>
              <input id="np-price" type="number" step="0.5" class="form-input" placeholder="e.g. 30" />
            </div>
            <div class="form-group">
              <label class="form-label">Preferred Grade</label>
              <select id="np-grade" class="form-select">
                <option value="any">Any Grade</option>
                <option value="A">Grade A — Premium</option>
                <option value="B">Grade B — Standard</option>
                <option value="C">Grade C — Economy</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Frequency</label>
              <select id="np-freq" class="form-select">
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-weekly</option>
                <option value="monthly">Monthly</option>
                <option value="one_time">One-time</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Preferred Delivery</label>
              <select id="np-delivery" class="form-select">
                <option value="farm_pickup">Farm Pickup</option>
                <option value="delivered">Delivered to me</option>
                <option value="mandi">Market / Mandi</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Notes</label>
            <textarea id="np-notes" class="form-textarea" rows="2"
              placeholder="Special requirements, packaging, quality notes…"></textarea>
          </div>
          <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
            <button class="btn btn-ghost btn-sm" onclick="hideAddPrefForm()">Cancel</button>
            <button class="btn btn-primary btn-sm" onclick="addPref()">&#10003; Save Preference</button>
          </div>
        </div>

        <!-- Saved preferences list -->
        <div id="pref-list">
          ${renderPrefCards(prefs)}
        </div>
      </div>`;
  }

  /* ════════════════════════════════════════════════
     Render preference cards
  ════════════════════════════════════════════════ */
  function renderPrefCards(prefs) {
    if (!prefs.length) {
      return `<div class="empty-state">
                <div class="empty-icon" style="font-size:2rem;">&#127807;</div>
                <p style="margin-top:8px;">No crop preferences saved yet.</p>
                <p style="font-size:0.8rem; color:var(--text-muted);">Add crops you regularly need so farmers can reach you with matching supply.</p>
              </div>`;
    }

    return prefs.map((p, idx) => `
      <div class="pref-card" id="pref-card-${idx}">
        <div class="pref-info">
          <div class="pref-name">&#127807; ${escapeHtml(p.crop)}</div>
          <div class="pref-meta">
            ${p.qty    ? `<span class="pref-tag">&#128202; ${p.qty} kg/month</span>` : ''}
            ${p.price  ? `<span class="pref-tag">&#8377; Max ${formatCurrency(p.price)}/kg</span>` : ''}
            ${p.grade  ? `<span class="pref-tag">Grade: ${p.grade === 'any' ? 'Any' : p.grade}</span>` : ''}
            ${p.freq   ? `<span class="pref-tag">&#128337; ${p.freq.replace('_', '-')}</span>` : ''}
            ${p.delivery ? `<span class="pref-tag">&#128666; ${p.delivery.replace(/_/g,' ')}</span>` : ''}
          </div>
          ${p.notes ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:6px;">${escapeHtml(p.notes)}</div>` : ''}

          <!-- Inline edit -->
          <div class="pref-edit-form" id="pef-${idx}">
            <div class="edit-grid-3" style="margin-top:10px;">
              <div class="form-group">
                <label class="form-label">Crop</label>
                <select id="pef-crop-${idx}" class="form-select">
                  ${ALL_CROPS.map(c => `<option ${c === p.crop ? 'selected' : ''}>${c}</option>`).join('')}
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Qty (kg/month)</label>
                <input id="pef-qty-${idx}" type="number" class="form-input" value="${p.qty || ''}" />
              </div>
              <div class="form-group">
                <label class="form-label">Max Price (₹/kg)</label>
                <input id="pef-price-${idx}" type="number" step="0.5" class="form-input" value="${p.price || ''}" />
              </div>
              <div class="form-group">
                <label class="form-label">Grade</label>
                <select id="pef-grade-${idx}" class="form-select">
                  <option value="any"  ${p.grade === 'any'  ? 'selected' : ''}>Any Grade</option>
                  <option value="A"    ${p.grade === 'A'    ? 'selected' : ''}>Grade A</option>
                  <option value="B"    ${p.grade === 'B'    ? 'selected' : ''}>Grade B</option>
                  <option value="C"    ${p.grade === 'C'    ? 'selected' : ''}>Grade C</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Frequency</label>
                <select id="pef-freq-${idx}" class="form-select">
                  <option value="weekly"   ${p.freq === 'weekly'   ? 'selected' : ''}>Weekly</option>
                  <option value="biweekly" ${p.freq === 'biweekly' ? 'selected' : ''}>Bi-weekly</option>
                  <option value="monthly"  ${p.freq === 'monthly'  ? 'selected' : ''}>Monthly</option>
                  <option value="one_time" ${p.freq === 'one_time' ? 'selected' : ''}>One-time</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Delivery</label>
                <select id="pef-delivery-${idx}" class="form-select">
                  <option value="farm_pickup" ${p.delivery === 'farm_pickup' ? 'selected' : ''}>Farm Pickup</option>
                  <option value="delivered"   ${p.delivery === 'delivered'   ? 'selected' : ''}>Delivered to me</option>
                  <option value="mandi"       ${p.delivery === 'mandi'       ? 'selected' : ''}>Market / Mandi</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Notes</label>
              <textarea id="pef-notes-${idx}" class="form-textarea" rows="2">${escapeHtml(p.notes || '')}</textarea>
            </div>
            <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px;">
              <button class="btn btn-ghost btn-sm" onclick="togglePrefEdit(${idx})">Cancel</button>
              <button class="btn btn-primary btn-sm" onclick="savePrefEdit(${idx})">&#10003; Save</button>
            </div>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
          <button class="btn btn-outline btn-sm" onclick="togglePrefEdit(${idx})">&#9998; Edit</button>
          <button class="btn btn-ghost btn-sm" style="color:var(--accent-admin);"
            onclick="deletePref(${idx})">&#10005;</button>
        </div>
      </div>`).join('');
  }

  /* ════════════════════════════════════════════════
     Preference helpers
  ════════════════════════════════════════════════ */
  function showAddPrefForm()  { document.getElementById('add-pref-form').style.display = 'block'; }
  function hideAddPrefForm()  { document.getElementById('add-pref-form').style.display = 'none'; }

  function togglePrefEdit(idx) {
    document.getElementById('pef-' + idx)?.classList.toggle('open');
  }

  function addPref() {
    const crop = document.getElementById('np-crop').value;
    if (!crop) { showToast('Select a crop', 'warn'); return; }

    const prefs = loadPrefs();
    prefs.push({
      crop,
      qty:      document.getElementById('np-qty').value || null,
      price:    document.getElementById('np-price').value || null,
      grade:    document.getElementById('np-grade').value,
      freq:     document.getElementById('np-freq').value,
      delivery: document.getElementById('np-delivery').value,
      notes:    document.getElementById('np-notes').value || null,
    });
    savePrefs(prefs);
    hideAddPrefForm();
    document.getElementById('pref-list').innerHTML = renderPrefCards(prefs);
    document.getElementById('pref-count').textContent = `${prefs.length} crop${prefs.length !== 1 ? 's' : ''} saved`;
    showToast(`${crop} preference saved!`, 'success');
  }

  function savePrefEdit(idx) {
    const prefs = loadPrefs();
    prefs[idx] = {
      crop:     document.getElementById('pef-crop-' + idx)?.value,
      qty:      document.getElementById('pef-qty-' + idx)?.value || null,
      price:    document.getElementById('pef-price-' + idx)?.value || null,
      grade:    document.getElementById('pef-grade-' + idx)?.value,
      freq:     document.getElementById('pef-freq-' + idx)?.value,
      delivery: document.getElementById('pef-delivery-' + idx)?.value,
      notes:    document.getElementById('pef-notes-' + idx)?.value || null,
    };
    savePrefs(prefs);
    document.getElementById('pref-list').innerHTML = renderPrefCards(prefs);
    document.getElementById('pref-count').textContent = `${prefs.length} crop${prefs.length !== 1 ? 's' : ''} saved`;
    showToast('Preference updated!', 'success');
  }

  function deletePref(idx) {
    const prefs = loadPrefs();
    const name  = prefs[idx]?.crop || 'item';
    if (!confirm(`Remove "${name}" preference?`)) return;
    prefs.splice(idx, 1);
    savePrefs(prefs);
    document.getElementById('pref-list').innerHTML = renderPrefCards(prefs);
    document.getElementById('pref-count').textContent = `${prefs.length} crop${prefs.length !== 1 ? 's' : ''} saved`;
    showToast(`${name} removed`, 'success');
  }

  /* ════════════════════════════════════════════════
     Profile inline edit toggle
  ════════════════════════════════════════════════ */
  function toggleProfileEdit() {
    document.getElementById('profile-edit-form')?.classList.toggle('open');
  }

  async function saveProfileEdit() {
    const btn  = document.getElementById('ep-save-btn');
    const data = {
      full_name:     document.getElementById('ep-name').value,
      mobile:        document.getElementById('ep-mobile').value,
      business_name: document.getElementById('ep-biz').value || null,
      business_type: document.getElementById('ep-biz-type').value || null,
      address:       document.getElementById('ep-address').value,
      district:      document.getElementById('ep-district').value,
      pincode:       document.getElementById('ep-pincode').value,
      gov_id_type:   document.getElementById('ep-gov-type').value,
      gov_id_number: document.getElementById('ep-gov-num').value || null,
    };

    if (!data.full_name || !data.mobile || !data.address || !data.district || !data.pincode) {
      showToast('Fill in all required fields', 'warn');
      return;
    }

    setLoading(btn, true);
    try {
      await API.patch('/api/customer/profile', data);
      showToast('Profile updated!', 'success');
      setTimeout(() => init(), 800);
    } catch (e) {
      console.error('[Profile Edit]', e);
    } finally {
      setLoading(btn, false);
    }
  }

  /* ════════════════════════════════════════════════
     Submit new profile (first-time registration)
  ════════════════════════════════════════════════ */
  async function submitProfile() {
    const data = {
      full_name:     document.getElementById('p-name').value,
      mobile:        document.getElementById('p-mobile').value,
      business_name: document.getElementById('p-biz').value || null,
      business_type: document.getElementById('p-biz-type').value || null,
      address:       document.getElementById('p-address').value,
      district:      document.getElementById('p-district').value,
      pincode:       document.getElementById('p-pincode').value,
      gov_id_type:   document.getElementById('p-gov-type').value,
      gov_id_number: document.getElementById('p-gov-num').value || null,
    };

    if (!data.full_name || !data.mobile || !data.address || !data.district || !data.pincode) {
      showToast('Fill in required fields', 'warn');
      return;
    }

    const btn = document.getElementById('submit-btn');
    setLoading(btn, true);
    try {
      await API.post('/api/customer/profile', data);
      showToast('Profile submitted for verification!', 'success');
      setTimeout(() => init(), 1000);
    } catch (e) {
      console.error('[Profile Submit]', e);
    } finally {
      setLoading(btn, false);
    }
  }

  /* ── Bootstrap ── */
  init();
</script>

<!-- Language switcher -->
<script>
  const ls = document.getElementById('nav-lang-switcher');
  if (ls && typeof I18N !== 'undefined') ls.innerHTML = I18N.renderSwitcher();
</script>

</body>
